on:
  pull_request:
  push:
    branches:
      - main
jobs:
	whatever:
		env:
			PROJECT_NAME: "ZeroOps Production"

		runs-on: ubuntu-latest
  	steps:
			- name: Checkout
			uses: actions/checkout@v4

	  	- name: Setup Python
			uses: actions/setup-python@v5
			with:
		  	python-version: '3.11'

			run: |
				pip install -r requirements.txt
				pytest
				echo "Success"


